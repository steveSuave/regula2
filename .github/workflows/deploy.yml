name: Deploy Flutter Web via GitHub Actions

on:
  push:
    branches:
      - main # Triggers when you push to the main branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web App
        # --wasm since Phase 122 (PLAN §"The hot loop was not where the
        # phase said it was"). It emits *both* main.dart.wasm and the
        # dart2js main.dart.js: a WasmGC browser fetches the 2.4 MB wasm,
        # anything older falls back to the 2.8 MB js it would have got
        # anyway. So modern browsers download less and run the kernel
        # faster, and no browser is dropped. The cost is ~2.4 MB more in
        # the Pages artifact, which nobody downloads twice.
        # Replace YOUR_REPOS_NAME with your repository name!
        run: flutter build web --wasm --release --base-href "/regula/"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4